name: Add Dropdown Navigation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch navigation
        run: python scripts/add_dropdown_navigation.py
      - name: Commit
        run: |
          git config user.name "Korea Plainly Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add dropdown category navigation"
            git push
          fi
