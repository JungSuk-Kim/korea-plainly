name: Korea Plainly Auto Publish

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI
        run: pip install openai

      - name: Generate Article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
        run: python scripts/generate_post.py

      - name: Add FAQ
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
        run: python scripts/add_article_faq.py

      - name: Update Sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape

          ROOT = Path(".")
          base_url = "https://korea-plainly.com"
          urls=["index.html","guides.html"]

          for path in sorted(ROOT.glob("*.html")):
              if path.name not in urls:
                  urls.append(path.name)

          lines=[
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]
          for page in urls:
              lines += ["  <url>",f"    <loc>{escape(base_url+'/'+page)}</loc>","  </url>"]
          lines.append("</urlset>")
          Path("sitemap.xml").write_text("\n".join(lines)+"\n",encoding="utf-8")
          print("Updated sitemap.xml")
          PY

      - name: Commit Article and SEO Files
        run: |
          git config user.name "Korea Plainly Bot"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Auto publish Korea guide and update SEO"
          git push
