name: Korea Plainly Site Audit
on:
  workflow_dispatch:
  push:
    paths: ["*.html","style.css","scripts/site_integrity_fix.py","scripts/site_audit.py"]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Run site audit
        run: python scripts/site_audit.py
