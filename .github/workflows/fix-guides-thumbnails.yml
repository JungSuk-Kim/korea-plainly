name: Fix Guides Thumbnails

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix guides thumbnails
        run: python scripts/fix_guides_thumbnails.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides.html

          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix guides thumbnails and numbering"
            git push
          fi
