name: Add Internal Links

on:
  workflow_dispatch:
  schedule:
    - cron: "45 23 * * *"

permissions:
  contents: write

jobs:
  internal-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add related guide links
        run: python scripts/add_internal_links.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'

          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Add internal links to Korea guides"
            git push
          fi
