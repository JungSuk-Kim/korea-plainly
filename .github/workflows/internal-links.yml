name: Add Internal Links

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  internal-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create internal link script
        run: |
          cat > internal_links.py <<'PY'
          from pathlib import Path
          from html import escape
          import re

          ROOT = Path(".")

          SKIP = {
              "index.html",
              "guides.html",
              "about.html",
              "contact.html",
              "privacy.html"
          }

          pages = []

          for p in ROOT.glob("*.html"):
              if p.name in SKIP:
                  continue

              text = p.read_text(encoding="utf-8")

              m = re.search(
                  r"<h1[^>]*>(.*?)</h1>",
                  text,
                  re.I | re.S
              )

              if not m:
                  continue

              title = re.sub("<.*?>", "", m.group(1))
              title = re.sub(r"\s+", " ", title).strip()

              pages.append({
                  "file": p.name,
                  "title": title
              })

          def words(value):
              return set(
                  re.findall(
                      r"[a-z]{4,}",
                      value.lower()
                  )
              )

          for page in pages:
              path = ROOT / page["file"]
              html = path.read_text(encoding="utf-8")

              if "Related guides" in html:
                  continue

              current_words = words(
                  page["title"] + " " + page["file"]
              )

              scored = []

              for other in pages:
                  if other["file"] == page["file"]:
                      continue

                  other_words = words(
                      other["title"] + " " + other["file"]
                  )

                  score = len(
                      current_words & other_words
                  )

                  if score > 0:
                      scored.append(
                          (score, other)
                      )

              scored.sort(
                  key=lambda x: x[0],
                  reverse=True
              )

              related = [
                  item[1]
                  for item in scored[:3]
              ]

              if not related:
                  continue

              links = "\n".join(
                  f'<li><a href="{escape(item["file"])}">'
                  f'{escape(item["title"])}'
                  f'</a></li>'
                  for item in related
              )

              block = f"""
<section class="related-guides">
<h2>Related guides</h2>
<ul>
{links}
</ul>
</section>
"""

              marker = "</article>"

              if marker in html:
                  html = html.replace(
                      marker,
                      block + "\n" + marker,
                      1
                  )

              else:
                  html += block

              path.write_text(
                  html,
                  encoding="utf-8"
              )

              print(
                  "Added internal links:",
                  page["file"]
              )
          PY

      - name: Apply internal links
        run: |
          python internal_links.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '*.html'

          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Add internal links to Korea guides"
            git push
          fi
