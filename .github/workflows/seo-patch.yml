name: Apply SEO Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply SEO patch
        run: python seo_patch.py

      - name: Commit SEO updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No SEO changes needed."
          else
            git commit -m "Apply SEO metadata to existing guides"
            git push
          fi
