name: Shorts (automatic)

# Mon, Wed, Fri 10:07 KST: write a short from the next article (content/shorts/queue.json), render it with
# narration, subtitles and music, and upload it to YouTube as PRIVATE (YouTube's rule for unaudited apps).
# The owner checks it in the YouTube Studio app and makes it public.
# Every hour: when an uploaded short has been made public, show it in its article.
on:
  schedule:
    - cron: "7 1 * * 1,3,5"
    - cron: "29 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "make (write, render, upload) or check (add public videos to the site)"
        default: "make"
      article:
        description: "Article slug for make (empty = next in the queue)"
        default: ""

permissions:
  contents: write

concurrency:
  group: site-bot
  cancel-in-progress: false

jobs:
  make:
    if: (github.event_name == 'schedule' && github.event.schedule == '7 1 * * 1,3,5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'make')
    runs-on: ubuntu-latest
    env:
      HAS_YT: ${{ secrets.YT_REFRESH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install requests pillow openai
      - name: Write the script
        id: write
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          spec=$(python scripts/write_short.py ${{ inputs.article }} | tail -1)
          echo "$spec"
          case "$spec" in content/shorts/*.json) echo "spec=$spec" >> "$GITHUB_OUTPUT"; echo "slug=$(basename "$spec" .json)" >> "$GITHUB_OUTPUT";; esac
      - name: Render
        if: steps.write.outputs.spec != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/make_short.py "${{ steps.write.outputs.spec }}" --voice
      - name: Keep the video for 30 days (download from this run's page)
        if: steps.write.outputs.spec != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.write.outputs.slug }}
          path: _shorts/${{ steps.write.outputs.slug }}-voice.*
          retention-days: 30
      - name: Upload to YouTube (private)
        if: steps.write.outputs.spec != '' && env.HAS_YT == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/youtube_shorts.py upload "${{ steps.write.outputs.slug }}"
      - name: Commit
        if: steps.write.outputs.spec != ''
        run: |
          git config user.name "Korea Plainly Bot"
          git config user.email "actions@github.com"
          git add _shorts content/shorts
          git commit -m "Short video: ${{ steps.write.outputs.slug }}" || exit 0
          git pull --rebase -X theirs
          git push

  check:
    if: (github.event_name == 'schedule' && github.event.schedule == '29 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'check')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Any uploads waiting?
        id: waiting
        run: |
          python -c "import json,sys; u=json.load(open('content/shorts/uploads.json')); sys.exit(0 if any(v.get('status')!='public' for v in u.values()) else 1)" \
            && echo "yes=1" >> "$GITHUB_OUTPUT" || echo "Nothing waiting."
      - name: Check YouTube and update the site
        if: steps.waiting.outputs.yes == '1'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          pip install -q requests pillow
          python scripts/youtube_shorts.py check
          if ! git diff --quiet content/videos.json; then python scripts/maintain_site.py; fi
      - name: Sort videos into playlists
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          pip install -q requests
          python scripts/youtube_playlists.py
      - name: Commit
        run: |
          git config user.name "Korea Plainly Bot"
          git config user.email "actions@github.com"
          before=$(git rev-parse HEAD)
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Shorts: show newly public videos on the site"
          git pull --rebase -X theirs
          git push
          python scripts/indexnow_ping.py "$before" || true
