name: Build Category And Region Hubs
on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build hubs
        run: python scripts/build_category_region_hubs.py
      - name: Commit
        run: |
          git config user.name "Korea Plainly Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build regional and category hubs"
            git push
          fi
