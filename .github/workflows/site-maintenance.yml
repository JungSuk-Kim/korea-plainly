name: Site Maintenance

# Runs when you push changes to pages, styles, scripts or content, or on demand.
# Does not write new articles.
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "style.css"
      - "scripts/**"
      - "content/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-bot
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow requests

      - name: Maintain site
        env:
          KP_FETCH_PHOTOS: "1"
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scripts/maintain_site.py

      - name: Commit
        run: |
          git config user.name "Korea Plainly Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Site maintenance"
            git pull --rebase
            git push
          fi
