name: Fix Regional Google Photos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch
        run: python scripts/patch_regional_google_photos.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_regional_day.py
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Include Google Places photos in regional articles"
            git push
          fi
