name: Korea Plainly Site Integrity Fix

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix_navigation_and_regions.py"
      - "scripts/build_category_region_hubs.py"
      - ".github/workflows/build-category-region-hubs.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair site
        run: python scripts/fix_navigation_and_regions.py
      - name: Commit repaired pages
        run: |
          git config user.name "Korea Plainly Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Repair Korea Plainly navigation and hub structure"
            git push
          fi
