name: Korea Plainly Site Integrity Fix
on:
  workflow_dispatch:
  schedule:
    - cron: "45 0 * * *"
  push:
    paths:
      - "scripts/site_integrity_fix.py"
      - "scripts/site_audit.py"
      - ".github/workflows/site-integrity-fix.yml"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair site
        run: python scripts/site_integrity_fix.py
      - name: Fix contact email
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("contact.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace('href="return0508@naver.com"', 'href="mailto:return0508@naver.com"')
          p.write_text(s, encoding="utf-8")
          PY
      - name: Audit repaired site
        run: python scripts/site_audit.py
      - name: Commit
        run: |
          git config user.name "Korea Plainly Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix site-wide integrity v5"
            git push
          fi
