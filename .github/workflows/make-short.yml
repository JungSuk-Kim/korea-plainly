name: Make short video

# Run by hand: renders a vertical short with AI narration from a script in content/shorts/
# (scripts/make_short.py) and commits it to _shorts/, which is not published on the site.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Script file in content/shorts/"
        required: true
        default: "content/shorts/seoul-3-day-itinerary.json"
      upload:
        description: "Also upload to YouTube as private for review (yes/no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: site-bot
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install requests pillow
      - name: Render with narration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/make_short.py "${{ inputs.spec }}" --voice
      - name: Upload to YouTube (private, for review)
        if: inputs.upload == 'yes'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          name=$(basename "${{ inputs.spec }}" .json)
          title=$(python -c "import json;print(json.load(open('${{ inputs.spec }}'))['title'])")
          python scripts/youtube_upload.py "_shorts/${name}-voice.mp4" "[TEST] ${title} #Shorts"
      - name: Keep the video for 30 days (download from this run's page)
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: _shorts/*-voice.*
          retention-days: 30
      - name: Commit the script and photo log
        run: |
          git config user.name "Korea Plainly Bot"
          git config user.email "actions@github.com"
          git add _shorts content/shorts
          git commit -m "Short video: ${{ inputs.spec }}" || exit 0
          git pull --rebase
          git push
