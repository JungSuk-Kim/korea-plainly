name: Fix Guides Category Structure
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch guides page
        run: python scripts/patch_guides_categories.py
      - name: Commit
        run: |
          git config user.name "Korea Plainly Bot"
          git config user.email "actions@github.com"
          git add guides.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix Guides category structure"
            git push
          fi
