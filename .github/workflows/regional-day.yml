name: Korea Plainly Regional Day

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  regional-day:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai
      - name: Publish one regional day
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/generate_regional_day.py
      - name: Build regional hub pages
        run: python scripts/generate_region_pages.py
      - name: Fix navigation and regional category pages
        run: python scripts/fix_navigation_and_regions.py
      - name: Update sitemap
        run: python scripts/update_sitemap.py
      - name: Commit
        run: |
          git config user.name 'Korea Plainly Bot'
          git config user.email 'actions@github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish regional Korea day and update hubs'
            git push
          fi
