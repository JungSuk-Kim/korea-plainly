name: Korea Plainly Regional Day

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  regional-day:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai

      - name: Publish one regional day
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/generate_regional_day.py

      - name: Update sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          base = "https://korea-plainly.com"
          html_files = sorted(Path(".").glob("*.html"))
          urls = [f"  <url><loc>{base}/{p.name}</loc></url>" for p in html_files]
          Path("sitemap.xml").write_text(
              '<?xml version="1.0" encoding="UTF-8"?>
'
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
'
              + "
".join(urls)
              + '
</urlset>
',
              encoding="utf-8"
          )
          PY

      - name: Commit regional articles
        run: |
          git config user.name "Korea Plainly Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Publish regional Korea day"
            git push
          fi
