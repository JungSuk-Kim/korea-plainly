name: Daily Publish

# Once a day (about 08:17 Korea time): write the new articles, then run every
# maintenance step once and commit everything in a single commit.
# GitHub sometimes delays or skips scheduled runs; the daily check starts this
# workflow by hand when that happens, and the guard below stops a second
# publish on the same day.
on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      guide_only:
        description: "Only write today's general guide (skips the same-day guard and the regional day)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: site-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Skip if today's articles are already published
        id: guard
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          if [ "${{ inputs.guide_only }}" = "true" ]; then
            echo "Guide only run."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif git log --since="30 hours ago" --format=%s | grep -q "^Daily publish $today"; then
            echo "Already published today ($today)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests openai pillow

      - name: Write a general guide
        id: guide
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
        run: |
          python scripts/generate_post.py
          python scripts/add_article_faq.py

      - name: Write the regional day
        id: regional
        if: steps.guard.outputs.skip != 'true' && inputs.guide_only != true
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/generate_regional_day.py

      - name: Maintain site
        if: steps.guard.outputs.skip != 'true'
        env:
          KP_FETCH_PHOTOS: "1"
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scripts/maintain_site.py

      - name: Commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "Korea Plainly Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Daily publish $(TZ=Asia/Seoul date +%F)"
            git pull --rebase
            git push
          fi

      - name: Tell search engines about changed pages (IndexNow)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: python scripts/indexnow_ping.py ""

      - name: Report failed writing steps
        if: steps.guide.outcome == 'failure' || steps.regional.outcome == 'failure'
        run: |
          echo "guide: ${{ steps.guide.outcome }}, regional: ${{ steps.regional.outcome }}"
          exit 1
